<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to HireSky</title>
    <link rel="stylesheet" href="./assests/vendor/fontawesome/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --bg-elevated: #121212;
            --bg-card: #161616;
            --border: #2a2a2a;
            --border-hover: #3a3a3a;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --text-faint: #6a6a6a;
            --accent: #ffffff;
            --accent-hover: #e0e0e0;
            --success: #4ade80;
            --error: #f87171;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-app-region: drag;
        }

        .card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            gap: 8px;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            background: #000;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .logo svg { width: 24px; height: 24px; }

        h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 12.5px;
            color: var(--text-dim);
            margin-bottom: 20px;
            text-align: center;
        }

        form {
            width: 100%;
            max-width: 280px;
            -webkit-app-region: no-drag;
        }

        .field {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 11.5px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 9px 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        input:focus {
            border-color: var(--border-hover);
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: default; }

        .error {
            display: none;
            font-size: 12px;
            color: var(--error);
            margin-top: 10px;
            text-align: center;
        }
        .error.visible { display: block; }

        .hint {
            margin-top: 18px;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-faint);
            width: 100%;
            max-width: 280px;
            text-align: center;
            line-height: 1.5;
        }
        .hint b { color: var(--text-dim); }

        .quit-link {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 11px;
            color: var(--text-faint);
            cursor: pointer;
            -webkit-app-region: no-drag;
        }
        .quit-link:hover { color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="quit-link" id="quitLink">Quit</div>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="5"/>
                <circle cx="32" cy="32" r="5.5" fill="#ffffff"/>
            </svg>
        </div>
        <h1>Sign in to HireSky</h1>
        <div class="subtitle">Your invisible AI interview copilot</div>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="submitBtn">Sign in</button>
            <div class="error" id="errorMsg"></div>
        </form>

        <div class="hint">
            <b>Demo access</b><br>
            demo@hiresky.app / HireSkyDemo@123
        </div>
    </div>

    <script src="./src/ui/login-window.js"></script>
</body>
</html>
